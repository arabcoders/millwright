<style>
  #spa-loading-page {
    color-scheme: dark;
    --bg: #0c0a09;
    --bg-deep: #1c1917;
    --panel: rgb(28 25 23 / 0.84);
    --border: rgb(168 162 158 / 0.16);
    --shadow: rgb(12 10 9 / 0.45);
    --text: #fafaf9;
    --muted: #a8a29e;
    --accent: #818cf8;
    --accent-soft: rgb(129 140 248 / 0.18);
    position: fixed;
    inset: 0;
    padding: calc(1rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right))
      calc(1rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));
    display: grid;
    place-items: center;
    overflow-x: hidden;
    color: var(--text);
    user-select: none;
    font-family:
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      'Segoe UI',
      sans-serif;
    background:
      radial-gradient(circle at top left, var(--accent-soft), transparent 24%),
      linear-gradient(180deg, var(--bg-deep), var(--bg));
  }

  .light #spa-loading-page {
    color-scheme: light;
    --bg: #fafaf9;
    --bg-deep: #f5f5f4;
    --panel: rgb(255 255 255 / 0.84);
    --border: rgb(28 25 23 / 0.1);
    --shadow: rgb(28 25 23 / 0.14);
    --text: #1c1917;
    --muted: #57534e;
    --accent: #4f46e5;
    --accent-soft: rgb(79 70 229 / 0.18);
  }

  #spa-loading-page::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(rgb(255 255 255 / 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgb(255 255 255 / 0.035) 1px, transparent 1px);
    background-size: 2rem 2rem;
    opacity: 0.32;
  }

  #spa-loading-page .loading-card {
    box-sizing: border-box;
    min-width: 400px;
    width: min(100%, 29rem);
    position: relative;
    padding: 1.65rem;
    border: 1px solid var(--border);
    border-radius: 1.1rem;
    background: var(--panel);
    box-shadow: 0 1rem 2.5rem var(--shadow);
    backdrop-filter: blur(16px);
  }

  #spa-loading-page .brand {
    display: flex;
    align-items: center;
    gap: 0.95rem;
  }

  #spa-loading-page .brand img {
    width: 2.8rem;
    height: 2.8rem;
    flex: none;
    display: block;
    object-fit: contain;
  }

  #spa-loading-page .brand-copy {
    min-width: 0;
  }

  #spa-loading-page .label {
    margin: 0;
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #spa-loading-page h1 {
    margin: 0.35rem 0 0;
    font-size: 1.55rem;
    line-height: 1.1;
    letter-spacing: -0.02em;
    font-weight: 700;
  }

  #spa-loading-page .description {
    margin: 1rem 0 0;
    color: var(--muted);
    font-size: 0.96rem;
    line-height: 1.55;
  }

  #spa-loading-page .loader {
    margin-top: 1.2rem;
    height: 0.32rem;
    overflow: hidden;
    border-radius: 999px;
    background: rgb(148 163 184 / 0.22);
  }

  #spa-loading-page .loader::before {
    content: '';
    display: block;
    width: 36%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: spa-loading-slide 1.35s ease-in-out infinite;
  }

  #spa-loading-page .hint {
    margin: 0.95rem 0 0;
    font-size: 0.82rem;
    color: var(--muted);
  }

  @keyframes spa-loading-slide {
    0% {
      transform: translateX(-130%);
    }

    100% {
      transform: translateX(330%);
    }
  }

  @media (max-width: 560px) {
    #spa-loading-page .loading-card {
      min-width: min(400px, 100%);
      padding: 1.3rem;
    }

    #spa-loading-page .brand {
      align-items: flex-start;
    }

    #spa-loading-page h1 {
      font-size: 1.35rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #spa-loading-page .loader::before {
      animation: none;
    }
  }
</style>

<div id="spa-loading-page">
  <main class="loading-card" role="status" aria-live="polite" aria-busy="true">
    <div class="brand">
      <img src="/images/favicon-192.png" alt="" aria-hidden="true" />

      <div class="brand-copy">
        <p class="label">Millwright</p>
        <h1>Loading App</h1>
      </div>
    </div>

    <p class="description">Getting the interface ready.</p>

    <div class="loader" aria-hidden="true"></div>
    <p class="hint">Please wait.</p>
  </main>
</div>
