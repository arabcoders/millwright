id = "inspector.stream_guard"
kind = "inspector"
description = "Reject output with too few audio or subtitle streams."
help = """
Run after transcoding. Check audio and subtitle counts separately.
Set a minimum to zero to disable its check. Optional comma-separated ISO-639-2
filters count any listed language. Missing tags count as und. Blank filters count all streams.
"""
name = "Stream guard"
author = "Millwright"
url = "https://github.com/arabcoders/millwright"
version = "1.0.0"
