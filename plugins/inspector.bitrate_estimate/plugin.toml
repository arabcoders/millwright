id = "inspector.bitrate_estimate"
kind = "inspector"
description = "Estimate AVC, HEVC, and AV1 bitrate and size."
help = """
Set a bitrate ratio for each codec. Files without video or a usable bitrate are skipped.
"""
name = "Bitrate estimate"
author = "Millwright"
url = "https://github.com/arabcoders/millwright"
version = "1.0.0"
facets = { avc_kbps = "int", avc_size_bytes = "int", hevc_kbps = "int", hevc_size_bytes = "int", av1_kbps = "int", av1_size_bytes = "int" }
