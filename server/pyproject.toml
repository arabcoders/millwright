[project]
name = "millwright-server"
version = "0.1.0"
description = "Transcode automation server."
requires-python = ">=3.14"
dependencies = [
  "millwright-common",
  "pydantic>=2.12",
  "sqlalchemy[asyncio]>=2.1",
  "psycopg[binary]>=3.3",
  "watchfiles>=1.2.0",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "wsproto>=1.3",
  "httpx>=0.28",
  "authlib>=1.6",
  "joserfc>=1.2",
  "cryptography>=44",
  "tomlkit>=0.13",
  "alembic>=1.16",
  "prometheus-client>=0.23",
  "python-multipart>=0.0.20",
  "apprise>=1.13,<2",
]

[project.scripts]
millwright-server = "server.__main__:main"
millwright = "server.cli:main"

[build-system]
requires = ["uv-build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
millwright-common = { workspace = true }

[tool.uv.build-backend]
module-name = "server"
