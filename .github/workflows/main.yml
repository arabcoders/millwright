name: build-docker-image

on:
  workflow_dispatch:
    inputs:
      build:
        description: Build and publish the container image
        type: boolean
        default: true
      update_readme:
        description: Sync the Docker Hub README
        type: boolean
        default: false
  push:
    branches: [dev, master, testing]
    tags: ["v*"]
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY }}
  DOCKERHUB_SLUG: arabcoders/millwright
  GHCR_SLUG: ghcr.io/arabcoders/millwright
  PYTHON_VERSION: "3.14"
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "24"
  UV_VERSION: "0.11.8"

jobs:
  test:
    name: Checks and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MW_TEST_DATABASE_URL: postgresql+psycopg://mw_ci:mw_ci@${{ vars.TEST_DATABASE_HOST || '127.0.0.1' }}:5432/mw_ci
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mw_ci
          POSTGRES_PASSWORD: mw_ci
          POSTGRES_DB: mw_ci
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql:uid=999,gid=999,mode=0700
          --health-cmd "pg_isready -U mw_ci -d mw_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"

      - name: Cache Python downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ env.UV_VERSION }}-${{ hashFiles('uv.lock') }}

      - name: Install Python dependencies
        run: uv sync --frozen --all-packages --dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('ui/bun.lock') }}

      - name: Install frontend dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Pre-commit checks
        env:
          # The full suite can exceed five minutes on hosted runners.
          PYTEST_ADDOPTS: "--session-timeout=900"
        run: .githooks/pre-commit --all

      - name: Build frontend
        working-directory: ui
        run: bun run build

      - name: Generate commit history
        run: python .github/scripts/generate_changelog.py

      - name: Upload frontend (GitHub)
        if: env.REGISTRY == ''
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: ui/exported/
          if-no-files-found: error
          retention-days: 7

      - name: Upload frontend (Gitea)
        if: env.REGISTRY != ''
        uses: ChristopherHX/gitea-upload-artifact@v4
        with:
          name: frontend-build
          path: ui/exported/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Build image (amd64)
    needs: test
    if: vars.REGISTRY == '' && (github.event_name == 'push' || github.event.inputs.build == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps: &build-image
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend (GitHub)
        if: env.REGISTRY == ''
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: ui/exported/

      - name: Download frontend (Gitea)
        if: env.REGISTRY != ''
        uses: ChristopherHX/gitea-download-artifact@v4
        with:
          name: frontend-build
          path: ui/exported/

      - name: Stamp application version
        env:
          BUILD_REF: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          ref = os.environ["BUILD_REF"]
          values = {
              "APP_VERSION": ref.rsplit("/", 1)[-1],
              "APP_COMMIT_SHA": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "APP_BUILD_DATE": datetime.now(timezone.utc).strftime("%Y%m%d"),
              "APP_BRANCH": ref.replace("/", "-"),
          }
          Path("common/src/common/version.py").write_text(
              "# CI-generated build identity.\n" + "".join(f"{name} = {value!r}\n" for name, value in values.items())
          )
          PY

      - name: Log in to private registry
        if: env.REGISTRY != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN }}

      - name: Log in to GHCR
        if: env.REGISTRY == ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.REGISTRY == ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: ./.github/actions/build-image
        with:
          publish: "true"

  docker-private:
    name: Build private-registry image (amd64)
    needs: test
    if: vars.REGISTRY != '' && (github.event_name == 'push' || github.event.inputs.build == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps: *build-image

  release-notes:
    name: Update GitHub release notes
    needs: docker
    if: github.server_url == 'https://github.com' && vars.REGISTRY == '' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Append release commits
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const repo = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag });
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...repo,
              per_page: 100,
            });
            const published = releases.filter(r => !r.draft);
            const baseTag = published[published.findIndex(r => r.id === release.id) + 1]?.tag_name;
            const commits = baseTag
              ? await github.paginate(github.rest.repos.compareCommitsWithBasehead, {
                  ...repo,
                  basehead: `${baseTag}...${tag}`,
                  per_page: 100,
                })
              : await github.paginate(github.rest.repos.listCommits, {
                  ...repo,
                  sha: tag,
                  per_page: 100,
                });
            const changelog = commits
              .filter(c => c.parents.length <= 1)
              .map(c => `- ${c.sha.substring(0, 7)} ${c.commit.message.split('\n')[0]}`)
              .join('\n');

            if (!changelog) {
              core.setFailed('No commits found for the release notes.');
              return;
            }

            const heading = baseTag ? `## Commits since ${baseTag}` : '## Commits';
            const existingBody = (release.body || '').trim();
            const body = existingBody
              ? `${existingBody}\n\n---\n\n${heading}\n\n${changelog}`
              : `${heading}\n\n${changelog}`;

            await github.rest.repos.updateRelease({
              ...repo,
              release_id: release.id,
              body,
            });

  dockerhub-sync-readme:
    name: Sync Docker Hub README
    needs: test
    runs-on: ubuntu-latest
    if: vars.REGISTRY == '' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.update_readme == 'true'))
    steps:
      - name: Sync README
        uses: docker://lsiodev/readme-sync:latest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          GIT_REPOSITORY: ${{ github.repository }}
          DOCKER_REPOSITORY: ${{ env.DOCKERHUB_SLUG }}
          GIT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          entrypoint: node
          args: /opt/docker-readme-sync/sync
