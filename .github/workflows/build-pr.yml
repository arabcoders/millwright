name: build-pr

on:
  pull_request:
    branches: [master, dev, testing]
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.REGISTRY }}
  DOCKERHUB_SLUG: arabcoders/millwright
  GHCR_SLUG: ghcr.io/arabcoders/millwright
  PYTHON_VERSION: "3.14"
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "24"
  UV_VERSION: "0.11.8"

jobs:
  test:
    name: Checks and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MW_TEST_DATABASE_URL: postgresql+psycopg://mw_ci:mw_ci@${{ vars.TEST_DATABASE_HOST || '127.0.0.1' }}:5432/mw_ci
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mw_ci
          POSTGRES_PASSWORD: mw_ci
          POSTGRES_DB: mw_ci
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql:uid=999,gid=999,mode=0700
          --health-cmd "pg_isready -U mw_ci -d mw_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"

      - name: Cache Python downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ env.UV_VERSION }}-${{ hashFiles('uv.lock') }}

      - name: Install Python dependencies
        run: uv sync --frozen --all-packages --dev

      - name: Check Python
        run: .githooks/pre-commit --all

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('ui/bun.lock') }}

      - name: Install frontend dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Check frontend formatting
        working-directory: ui
        run: bun run format:check

      - name: Lint frontend
        working-directory: ui
        run: bun run lint:ci

      - name: Check frontend types
        working-directory: ui
        run: bun run lint:tsc

      - name: Test frontend
        working-directory: ui
        run: bun test

      - name: Build frontend
        working-directory: ui
        run: bun run build

      - name: Generate bundled commit history
        run: python .github/scripts/generate_changelog.py

      - name: Upload frontend (GitHub)
        if: env.REGISTRY == ''
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: ui/exported/
          if-no-files-found: error
          retention-days: 7

      - name: Upload frontend (Gitea)
        if: env.REGISTRY != ''
        uses: ChristopherHX/gitea-upload-artifact@v4
        with:
          name: frontend-build
          path: ui/exported/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Validate image (amd64)
    needs: test
    if: vars.REGISTRY == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps: &build-image
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend (GitHub)
        if: env.REGISTRY == ''
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: ui/exported/

      - name: Download frontend (Gitea)
        if: env.REGISTRY != ''
        uses: ChristopherHX/gitea-download-artifact@v4
        with:
          name: frontend-build
          path: ui/exported/

      - name: Stamp application version
        env:
          BUILD_REF: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          ref = os.environ["BUILD_REF"]
          values = {
              "APP_VERSION": ref.rsplit("/", 1)[-1],
              "APP_COMMIT_SHA": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "APP_BUILD_DATE": datetime.now(timezone.utc).strftime("%Y%m%d"),
              "APP_BRANCH": ref.replace("/", "-"),
          }
          Path("common/src/common/version.py").write_text(
              "# CI-generated build identity.\n" + "".join(f"{name} = {value!r}\n" for name, value in values.items())
          )
          PY

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate image
        uses: ./.github/actions/build-image

  docker-private:
    name: Validate private-registry image (amd64)
    needs: test
    if: vars.REGISTRY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps: *build-image
