name: Build image
description: Build the amd64 images
inputs:
  publish:
    description: Publish the image
    default: "false"
runs:
  using: composite
  steps:
    - name: Image metadata
      if: inputs.publish == 'true'
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          name=${{ env.DOCKERHUB_SLUG }},enable=${{ env.REGISTRY == '' }}
          name=${{ env.GHCR_SLUG }},enable=${{ env.REGISTRY == '' }}
          name=${{ env.REGISTRY }}/${{ github.repository }},enable=${{ env.REGISTRY != '' }}
        flavor: latest=false
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Build image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64
        push: ${{ inputs.publish == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=container-${{ github.ref_name }}-amd64
        cache-to: type=gha,mode=max,scope=container-${{ github.ref_name }}-amd64
        provenance: ${{ inputs.publish == 'true' }}
