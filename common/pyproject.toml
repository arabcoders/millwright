[project]
name = "millwright-common"
version = "0.1.0"
description = "Shared protocol models, FFmpeg plan, renderer, and enums."
requires-python = ">=3.14"
dependencies = [
    "pycountry>=26.2.16",
    "pydantic>=2.12",
    "structlog>=25.4.0",
]

[build-system]
requires = ["uv-build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "common"
